name: Compilar APK

on:
  push:
    branches: [ "main", "master", "claude/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas de la lógica del editor
        run: ./gradlew :core:test --stacktrace

      - name: Compilar APK de depuración
        run: |
          set -o pipefail
          # Si falla, los errores de compilación se muestran como anotaciones del trabajo.
          ./gradlew :app:assembleDebug 2>&1 | tee build.log || {
            grep '^e: ' build.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: edicion-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publica el APK como descarga directa (se sustituye en cada compilación).
      - name: Publicar APK en Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk edicion.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima edicion.apk \
            --target "$GITHUB_SHA" \
            --title "Última compilación" \
            --notes "APK de prueba generado automáticamente desde $GITHUB_SHA." \
            --prerelease
